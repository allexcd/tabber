<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Tab Grouper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="popup">
      <header>
        <h1>🗂️ AI Tab Grouper</h1>
      </header>

      <main>
        <div class="status-row">
          <button id="toggle-btn" class="btn primary toggle-control">
            <span id="toggle-text">Enable</span>
          </button>
          <div class="status-card" id="status-card">
            <div class="status-indicator" id="status-indicator"></div>
            <div class="status-text">
              <span id="status-label">Checking...</span>
              <span id="provider-label" class="provider"></span>
            </div>
          </div>
        </div>
        <div id="browser-warning" class="browser-warning hidden"></div>

        <button
          id="group-all-btn"
          class="btn full-width"
          data-tooltip="Analyzes all open tabs together in one AI plan, then regroups tabs into reusable categories."
          data-tooltip-theme="group"
          aria-label="Group All Tabs: analyzes all open tabs together and regroups them."
        >
          🧠 Group All Tabs
        </button>

        <button
          id="ungroup-all-btn"
          class="btn full-width destructive"
          data-tooltip="Removes every tab from its current tab group in this window."
          data-tooltip-theme="ungroup"
          aria-label="Ungroup All Tabs: removes every tab from its current tab group."
        >
          🧹 Ungroup All Tabs
        </button>

        <button id="settings-btn" class="btn text">⚙️ Settings</button>
      </main>
    </div>

    <div id="fast-tooltip" class="fast-tooltip hidden" role="tooltip" aria-hidden="true"></div>

    <script type="module" src="popup.js"></script>
  </body>
</html>
